# 03-文章阅读.yaml；修改冒号右侧的文字，保留字段名和缩进。
# 保存后运行 .\更新网站.ps1，再刷新 Chrome。
# 这是独立的 GitHub Pages 静态副本，不影响原完整网站。

# 同目录分篇阅读链接的辅助名称
adjacent: "同目录文章"

# 文章底部的上一篇链接
previous: "上一篇"

# 文章底部的下一篇链接
next: "下一篇"

# 文章顶部返回文库链接
back: "返回文库"

# 文章日期旁的格式说明
formats: "网页全文 / PDF"

# 侧边目录标题（手机折叠按钮）
toc: "本页目录"

# 目录的辅助阅读名称
tocLabel: "文章目录"

# 侧边工具中的 PDF 下载链接
downloadPdf: "下载 PDF"

# 侧边工具中的回到顶部链接
top: "回到顶部"

# 文章底部的相关资料标题
resources: "相关资料"

# 底部 PDF 下载名称
articlePdf: "文章 PDF"

# 底部 PDF 下载说明
pdfDescription: "与网页对应的完整文章"

# 普通附件说明
attachment: "配套文件"
