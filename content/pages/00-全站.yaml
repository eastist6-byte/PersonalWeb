# 00-全站.yaml；修改冒号右侧的文字，保留字段名和缩进。
# 保存后运行 .\更新网站.ps1，再刷新 Chrome。
# 这是独立的 GitHub Pages 静态副本，不影响原完整网站。

# 左上角站名、浏览器标签标题后缀、页脚站名
siteTitle: "临时的永久站点"

# 网页默认描述（meta description），用于摘要；不显示在正文，也不是站名下方的小字
pageDescription: "欢迎访问"

# 站名首页链接的辅助阅读名称；保留 {title}
brandLabel: "{title}首页"

# 左上角站名下方的小字
brandTagline: "持续进化中…"

# 键盘操作时出现的“跳到正文”链接
skip: "跳到正文"

# 导航区域的辅助阅读名称
navLabel: "主导航"

# 手机端菜单按钮的辅助阅读名称
navToggle: "展开导航"

# 导航：首页
home: "首页"

# 导航：文库，也用于首页文库入口
library: "文库"

# 导航：下载区，也用于首页下载入口
downloads: "下载区"

# 导航：留言板，也用于首页留言入口
messages: "留言板"

# 导航：关于
about: "关于"

# 页脚左侧说明
footer: "这里是我的底线"

# 文库“全部文章”筛选，也用于首页查看全部的入口
allArticles: "全部文章"

# 文库搜索结果数量；保留 {count}
articleCount: "{count} 篇文章"

# 文库目录旁的文章数量；保留 {count}
shortCount: "{count} 篇"
