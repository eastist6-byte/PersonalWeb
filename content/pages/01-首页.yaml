# 01-首页.yaml；修改冒号右侧的文字，保留字段名和缩进。
# 保存后运行 .\更新网站.ps1，再刷新 Chrome。
# 这是独立的 GitHub Pages 静态副本，不影响原完整网站。

# 首页右侧头像的替代文字；用于辅助阅读或图片加载失败时
avatarAlt: "个人头像"

# 首页上方的个人简介大标题
heading: "淋漓"

# 个人简介正文；多段可写成 YAML 多行文字
intro: "一个匮乏的人。"

# 个人简介下方的说明
contact: "本站提供公开文章、笔记及相关资料下载。"

# 文库、留言板和下载入口上方的栏目标题
entries: "栏目入口"

# 首页文库入口的说明
libraryDescription: "按目录查看文章和笔记，支持标题与简介搜索。"

# 首页留言板入口的说明；留言板为空白页面
messagesDescription: "留言板页面。"

# 首页下载入口的说明
downloadsDescription: "下载文章 PDF 和配套文件。"

# 最近更新列表的标题
latest: "推荐阅读"

# 个人简介下方的关于页面链接
aboutLink: "关于网站"
