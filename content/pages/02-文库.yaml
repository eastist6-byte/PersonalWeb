# 02-文库.yaml；修改冒号右侧的文字，保留字段名和缩进。
# 保存后运行 .\更新网站.ps1，再刷新 Chrome。
# 这是独立的 GitHub Pages 静态副本，不影响原完整网站。

# 文库大标题与浏览器标签页标题
title: "文库"

# 文库大标题下面的说明
description: "感觉不如AI写的。"

# 左侧目录标题
directory: "文章目录"

# 目录下方的搜索说明
searchNote: "搜索范围为标题与简介。"

# 文章列表的辅助阅读名称
listLabel: "文章列表"

# 搜索框的辅助阅读名称
searchLabel: "搜索标题与简介"

# 搜索框中未输入时的文字
searchPlaceholder: "输入标题或简介中的关键词"

# 筛选结果的备用标签
filterResult: "筛选结果"

# 搜索无结果时的标题
emptyHeading: "没有找到文章"

# 搜索无结果时的说明
emptyDescription: "请更换关键词，或清除当前筛选。"

# 清除筛选按钮
reset: "清除筛选"
